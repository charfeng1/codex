name: Sync upstream main

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    name: Merge openai/codex main
    runs-on: ubuntu-latest
    if: github.repository == 'charfeng1/codex'
    steps:
      - name: Merge upstream main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git init --initial-branch=main .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git remote add upstream https://github.com/openai/codex.git

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags upstream +refs/heads/main:refs/remotes/upstream/main
          git checkout -B main origin/main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork already contains upstream/main."
            exit 0
          fi

          git merge --no-edit -m "Sync upstream main [skip ci]" upstream/main
          git push origin HEAD:main
