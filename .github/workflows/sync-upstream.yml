name: Sync upstream main

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    name: Merge openai/codex main
    runs-on: ubuntu-latest
    if: github.repository == 'charfeng1/codex'
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/openai/codex.git || \
            git remote set-url upstream https://github.com/openai/codex.git

          git fetch origin main
          git fetch upstream main
          git checkout -B main origin/main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork already contains upstream/main."
            exit 0
          fi

          git merge --no-edit -m "Sync upstream main [skip ci]" upstream/main
          git push origin main
